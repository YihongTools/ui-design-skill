name: Static Skill Validation

on:
  push:
    paths:
      - 'ui-design/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - 'ui-design/**'
      - 'scripts/**'
      - 'evals/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Skill contract
        run: python scripts/validate_skill.py
      - name: Test validator
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
