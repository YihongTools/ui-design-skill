<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intentional brand styling</title>
  <style>
    body { font: 16px/1.55 system-ui, sans-serif; margin: 0; background: #fff; color: #242034; }
    header { background: linear-gradient(110deg, #6633aa, #35226a); color: #fff; padding: 3rem 1.5rem; }
    header h1 { margin: 0; }
    main { max-width: 60rem; margin: 0 auto; padding: 1.5rem; }
    .panel { border: 1px solid #ddd5ea; border-radius: 18px; padding: 1.5rem; }
    a:focus-visible { outline: 3px solid #e5a723; outline-offset: 3px; }
  </style>
</head>
<body>
<header><h1>Northstar Studio</h1><p>Brand identity includes the gradient header.</p></header>
<main><section class="panel"><h2>Updates</h2><p>Read recent release notes.</p><a href="#notes">View notes</a></section><div id="notes">No further notes.</div></main>
</body>
</html>
